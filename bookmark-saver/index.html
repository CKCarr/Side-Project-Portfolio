<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Saver</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <h1>Bookmark Saver</h1>
        <div class="input-container">
            <input type="text" id="bookmark-name" placeholder="Bookmark Name">
            <input type="url" id="bookmark-url" placeholder="Bookmark URL">
            <button id="add-bookmark">Add Bookmark</button>
        </div>
        <ul id="bookmark-list">
            <!-- <li><a>list item</a><button>Remove</button></li>
            <li><a>list item</a><button>Remove</button></li> -->

        </ul>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
