<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main container for the quiz game -->
    <div class="container">
        <!-- Main Screen container with 3 sections start,quiz, -->
        <div class="screen active" id="start-screen">
            <h1>Quiz Game :)</h1>
            <p>Have fun & Test your knowledge!</p>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span> of <span id="total-questions">5</span>
                    </p>

                    <p>Score: <span id="score">0</span></p>
                </div>
            </div>

            <div id="answers-container" class="answers-container">
                <!-- Answer buttons will be inserted here from our js code later at some point -->
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>
        <!-- Results Screen -->
        <div class="screen " id="result-screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>You scored
                    <span id="final-score">0</span>
                    out of
                    <span id="max-score">5</span>
                </p>
                <div id="result-message">Good Job!</div>
            </div>
            <button id="restart-btn">Restart Quiz</button> </button>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
