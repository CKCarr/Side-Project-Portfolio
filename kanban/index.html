<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Simple Kanban</h1>
        <p>Drag and drop cards between lists.</p>
        <div class="add-task">
            <input type="text" id="newTaskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>
        <div class="board">
            <!-- LIST  1 -->
            <div class="list" id="list1">
                <h2>To Do</h2>
                <!-- card -->
                <div class="card" draggable="true" id="card1">
                    Wash Dishes
                </div>
                <!-- card -->
                <div class="card" draggable="true" id="card2">
                    Clean Car
                </div>
            </div>
            <!-- LIST 2 -->
            <div class="list" id="list2">
                <h2>In Progress</h2>
                <!-- card -->
                <div class="card" draggable="true" id="card3">
                    Read Book
                </div>
            </div>
            <!-- LIST 3 -->
            <div class="list" id="list3">
                <h2>Done</h2>
                <!-- card -->
                <div class="card" draggable="true" id="card4">
                    Write Code
                </div>
            </div>
        </div>
        <script type="module" src="script.js"></script>
</body>


</html>
